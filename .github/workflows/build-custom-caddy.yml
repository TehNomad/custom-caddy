name: Build Custom Caddy if New Version Available

on:
  workflow_dispatch: # Allows manual triggering
  schedule:
    - cron: '0 */6 * * *' # Increased frequency: runs every 6 hours

jobs:
  check_version:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check_release.outputs.result }}
      caddy_version: ${{ steps.caddy_version.outputs.release }}
    steps:
      - name: 🔎 Get latest Caddy version
        id: caddy_version
        uses: pozetroninc/github-action-get-latest-release@v0.8.0
        with:
          repository: caddyserver/caddy
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📝 Check if release for this version already exists
        id: check_release
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const release = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: 'custom-${{ steps.caddy_version.outputs.release }}',
              });
              console.log('Release custom-${{ steps.caddy_version.outputs.release }} already exists.');
              return false; // Release exists, do not proceed
            } catch (error) {
              if (error.status === 404) {
                console.log('No release found for custom-${{ steps.caddy_version.outputs.release }}. Proceeding to build.');
                return true; // Release does not exist, proceed
              } else {
                throw error; // Rethrow other errors
              }
            }

  build:
    needs: check_version
    if: needs.check_version.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to create the GitHub Release

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false # Disabled default cache in favor of robust custom cache below

      - name: 📦 Cache Go modules, build cache, and xcaddy
        id: cache-go
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/go/bin/xcaddy
          key: ${{ runner.os }}-caddy-${{ needs.check_version.outputs.caddy_version }}-${{ hashFiles('CADDY_PLUGINS.txt') }}
          restore-keys: |
            ${{ runner.os }}-caddy-

      - name: 🛠️ Install xcaddy
        if: steps.cache-go.outputs.cache-hit != 'true'
        run: go install github.com/caddyserver/xcaddy/cmd/xcaddy@latest

      - name: 📚 Read plugin list from file
        id: plugins
        run: |
          echo "plugin_args=$(sed 's/^/--with /' CADDY_PLUGINS.txt | xargs)" >> $GITHUB_OUTPUT

      - name: 🏗️ Build custom Caddy binary
        run: |
          ~/go/bin/xcaddy build ${{ needs.check_version.outputs.caddy_version }} \
            --output caddy-custom \
            ${{ steps.plugins.outputs.plugin_args }}
            
          # Generate SHA-256 checksum for deployment verification
          sha256sum caddy-custom > caddy-custom.sha256

      - name: 🎉 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: custom-${{ needs.check_version.outputs.caddy_version }}
          name: Custom Caddy - ${{ needs.check_version.outputs.caddy_version }}
          body: |
            This is an automated build of Caddy version **${{ needs.check_version.outputs.caddy_version }}** with the following custom plugins:

            ```
            ${{ steps.plugins.outputs.plugin_args }}
            ```
          files: |
            caddy-custom
            caddy-custom.sha256
